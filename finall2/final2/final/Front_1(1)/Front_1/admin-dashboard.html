<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد مدیر - ۱۴۰۴</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #3b82f6;
            --primary-blue-light: #60a5fa;
            --primary-blue-dark: #2563eb;
            --primary-purple: #8b5cf6;
            --primary-purple-light: #a78bfa;
            --primary-purple-dark: #7c3aed;
            --gradient-main: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-purple) 100%);
            --gradient-reverse: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-blue) 100%);
            --gradient-light: linear-gradient(135deg, var(--primary-blue-light) 0%, var(--primary-purple-light) 100%);
            --white: #ffffff;
            --light: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-600: #475569;
            --gray-800: #1e293b;
            --border-radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #f5f3ff 100%);
            color: var(--gray-800);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 1400px;
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.15);
            overflow: hidden;
            border: 1px solid var(--gray-200);
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 30px;
            text-align: center;
            width: 100%;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.95;
            max-width: 800px;
            margin: 0 auto 25px;
        }

        .academic-year {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            backdrop-filter: blur(10px);
            margin-top: 15px;
        }

        .admin-info {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 24px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .admin-avatar {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .admin-details h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .admin-details p {
            font-size: 14px;
            opacity: 0.9;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.95;
            max-width: 800px;
            margin: 0 auto 25px;
        }

        .academic-year {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            backdrop-filter: blur(10px);
        }

        .academic-year i {
            font-size: 20px;
        }

        .main-content {
            padding: 50px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .feature-card {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.08);
            border: 2px solid var(--gray-200);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            
            animation: floatUpDown 4s ease-in-out infinite;
        }

        .feature-card:nth-child(1) { animation-delay: 0s; }
        .feature-card:nth-child(2) { animation-delay: 0.3s; }

        @keyframes floatUpDown {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .feature-card:hover {
            animation-play-state: paused;
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(139, 92, 246, 0.15);
            border-color: var(--primary-blue-light);
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 6px;
        }

        .feature-card:nth-child(1)::before { 
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-purple)); 
        }
        .feature-card:nth-child(2)::before { 
            background: linear-gradient(90deg, var(--primary-purple), var(--primary-blue)); 
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .card-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
        }

        .feature-card:nth-child(1) .card-icon { 
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        .feature-card:nth-child(2) .card-icon { 
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
        }

        .card-title h2 {
            font-size: 26px;
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 10px;
        }

        .card-title p {
            color: var(--gray-600);
            font-size: 16px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 16px 35px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            width: 100%;
            margin-top: auto;
            color: white;
        }

        .feature-card:nth-child(1) .btn { 
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }
        .feature-card:nth-child(2) .btn { 
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .feature-card:nth-child(1) .btn:hover { 
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, var(--primary-blue-light), var(--primary-purple-light));
        }
        .feature-card:nth-child(2) .btn:hover { 
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.4);
            background: linear-gradient(135deg, var(--primary-purple-light), var(--primary-blue-light));
        }

        .stats-section {
            grid-column: 1 / -1;
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.1);
            border: 2px solid var(--gray-200);
        }

        .stats-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 35px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .stat-card {
            text-align: center;
            padding: 30px;
            background: var(--light);
            border-radius: var(--border-radius);
            border: 2px solid var(--gray-200);
            transition: var(--transition);
        }

        .stat-card:hover {
            border-color: var(--primary-purple-light);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.15);
        }

        .stat-number {
            font-size: 42px;
            font-weight: 900;
            color: var(--primary-purple);
            margin-bottom: 10px;
            line-height: 1;
        }

        .stat-label {
            font-size: 16px;
            color: var(--gray-600);
            font-weight: 600;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: var(--gray-600);
            font-size: 14px;
            background: var(--light);
            border-top: 2px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .back-button-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .back-button {
            background: var(--gradient-main);
            color: white;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
            min-width: 200px;
            justify-content: center;
        }

        .back-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.4);
            background: var(--gradient-reverse);
        }

        .footer-info {
            margin-bottom: 10px;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 80px 20px 30px;
            }
            
            .admin-info {
                top: 15px;
                left: 15px;
                right: 15px;
                justify-content: center;
                padding: 10px 20px;
            }
            
            .header h1 {
                font-size: 28px;
                flex-direction: column;
                gap: 10px;
            }
            
            .main-content {
                padding: 30px;
                gap: 25px;
            }
            
            .feature-card {
                padding: 30px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .card-header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
                margin-bottom: 20px;
            }
            
            .back-button {
                padding: 14px 30px;
                font-size: 15px;
                min-width: 180px;
            }
            
            .card-title h2 {
                font-size: 24px;
            }
            
            .card-title p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <h1>
                <i class="fas fa-university"></i>
                داشبورد مدیریت آموزشی
            </h1>
            <p>مدیریت کامل دروس، تعیین واحد و برنامه‌ریزی آموزشی</p>
            <div class="academic-year">
                <i class="fas fa-calendar-alt"></i>
                نیمسال اول ۱۴۰۴
            </div>
        </header>

        <main class="main-content">
            <div class="feature-card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-book-open"></i>
                    </div>
                    <div class="card-title">
                        <h2>مدیریت دروس</h2>
                        <p>ایجاد، ویرایش و مدیریت کامل دروس آموزشی</p>
                    </div>
                </div>

                <button class="btn" onclick="goToCoursesManagement()">
                    <i class="fas fa-arrow-left"></i>
                    ورود به بخش مدیریت دروس
                </button>
            </div>

            <div class="feature-card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-clipboard-check"></i>
                    </div>
                    <div class="card-title">
                        <h2>تعیین واحد اخذ شده</h2>
                        <p>ثبت و مدیریت واحدهای اخذ شده توسط دانشجویان</p>
                    </div>
                </div>

                <button class="btn" onclick="goToUnitsManagement()">
                    <i class="fas fa-arrow-left"></i>
                    ورود به بخش تعیین واحد
                </button>
            </div>

            <section class="stats-section">
                <h3 class="stats-title">
                    <i class="fas fa-chart-bar"></i>
                    آمار سیستم آموزشی
                </h3>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="activeCourses">۱۴۲</div>
                        <div class="stat-label">دروس فعال</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-number" id="totalStudents">۲,۸۴۷</div>
                        <div class="stat-label">دانشجو</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-number" id="totalProfessors">۸۶</div>
                        <div class="stat-label">استاد</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-number" id="coverageRate">۹۸%</div>
                        <div class="stat-label">پوشش درس</div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="back-button-container">
                <div class="back">
                    <button class="back-button" onclick="goToMainPage()">
                        <i class="fas fa-arrow-right"></i>
                        بازگشت به صفحه اصلی
                    </button>
                </div>
        </footer>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000/api/';
        
        let accessToken = localStorage.getItem('access_token');

        function checkAuth() {
            if (!accessToken) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        function loadDisplayStats() {
            const displayStats = {
                activeCourses: 142,
                totalStudents: 2847,
                totalProfessors: 86,
                coverageRate: '98%'
            };
        
            document.getElementById('activeCourses').textContent = displayStats.activeCourses;
            document.getElementById('totalStudents').textContent = displayStats.totalStudents;
            document.getElementById('totalProfessors').textContent = displayStats.totalProfessors;
            document.getElementById('coverageRate').textContent = displayStats.coverageRate;
        }

        async function refreshToken() {
            try {
                const refreshToken = localStorage.getItem('refresh_token');
                const response = await fetch(`${BASE_URL}/auth/refresh`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh: refreshToken })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    accessToken = data.access;
                    localStorage.setItem('access_token', accessToken);
                    return true;
                }
            } catch (error) {
                console.error('Error refreshing token:', error);
            }
            return false;
        }

        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login.html';
                throw new Error('No token');
            }
        
            if (!options.headers) options.headers = {};
            options.headers['Authorization'] = `Bearer ${token}`;
        
            let response = await fetch(url, options);
        
            if (response.status === 401) {
                const refreshed = await refreshToken();
                if (refreshed) {
                    const newToken = localStorage.getItem('access_token');
                    options.headers['Authorization'] = `Bearer ${newToken}`;
                    response = await fetch(url, options);
                } else {
                    window.location.href = 'login.html';
                    throw new Error('Auth failed');
                }
            }
        
            return response;
        }
        function goToCoursesManagement() {
            if (checkAuth()) {
                window.location.href = 'courses-management.html';
            }
        }

        function goToUnitsManagement() {
            if (checkAuth()) {
                window.location.href = 'units-management.html';
            }
        }

        // function logout() {
        //     localStorage.removeItem('access_token');
        //     localStorage.removeItem('refresh_token');
        //     localStorage.removeItem('user_role');
        //     localStorage.removeItem('user_id');
        //     window.location.href = 'login.html';
        // }

        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
        
            loadDisplayStats();
            
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                });
            });

            const backButton = document.querySelector('.back-button');
            if (backButton) {
                backButton.addEventListener('click', function() {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                        logout();
                    }, 200);
                });
            }
            document.querySelectorAll('.feature-card').forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.animationPlayState = 'paused';
                });
                
                card.addEventListener('mouseleave', function() {
                    this.style.animationPlayState = 'running';
                });
            });

            const adminAvatar = document.querySelector('.admin-avatar');
            adminAvatar.addEventListener('click', function() {
                alert('اطلاعات مدیر:\n\nنام: مدیر سیستم\nسطح دسترسی: ادمین\nآخرین ورود: امروز ۱۰:۳۰\nوضعیت: آنلاین');
            });
        });

        function goToMainPage() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
