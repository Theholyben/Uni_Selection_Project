<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به سامانه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #FAF8FF 0%, #F3EFFF 30%, #EDE9FE 60%, #F5F3FF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Background Circles */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .bg-circle-1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle at center, rgba(155, 127, 255, 0.12) 0%, rgba(155, 127, 255, 0.04) 40%, transparent 70%);
      top: 8%;
      left: 12%;
      animation: float 7s ease-in-out infinite;
    }

    .bg-circle-2 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle at center, rgba(123, 95, 232, 0.1) 0%, rgba(123, 95, 232, 0.03) 50%, transparent 70%);
      top: 55%;
      left: 8%;
      animation: float 9s ease-in-out infinite 1.5s;
    }

    .bg-circle-3 {
      width: 120px;
      height: 120px;
      border: 2.5px solid rgba(139, 111, 232, 0.25);
      top: 18%;
      left: 22%;
      animation: float 8s ease-in-out infinite 2s;
    }

    .bg-circle-4 {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at center, rgba(171, 143, 255, 0.15) 0%, transparent 60%);
      top: 12%;
      left: 30%;
      animation: float 6s ease-in-out infinite 0.5s;
    }

    /* Decorative Dots */
    .dots {
      position: absolute;
      pointer-events: none;
    }

    .dots::before,
    .dots::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(107, 79, 216, 0.35);
      border-radius: 50%;
    }

    .dots-1 {
      top: 68%;
      right: 28%;
    }

    .dots-1::before {
      top: 0;
      left: 0;
    }

    .dots-1::after {
      top: 20px;
      left: 20px;
      width: 7px;
      height: 7px;
      opacity: 0.6;
    }

    .dots-2 {
      top: 25%;
      left: 18%;
    }

    .dots-2::before {
      width: 8px;
      height: 8px;
      opacity: 0.5;
    }

    /* Curved Line */
    .curved-line {
      position: absolute;
      top: 22%;
      left: 16%;
      pointer-events: none;
      opacity: 0.7;
    }

    /* Paper Plane */
    .paper-plane-container {
      position: absolute;
      top: 12%;
      right: 18%;
      z-index: 10;
      animation: flyPlane 10s ease-in-out infinite;
    }

    .plane-trail {
      position: absolute;
      top: 8px;
      right: 45px;
    }

    .paper-plane {
      position: relative;
      filter: drop-shadow(0 2px 4px rgba(107, 79, 216, 0.3));
    }

    /* ID Card */
    .id-card-wrapper {
      position: absolute;
      bottom: 18%;
      left: 12%;
      z-index: 5;
      animation: float 8s ease-in-out infinite 1s;
    }

    .id-card {
      width: 200px;
      height: 130px;
      background: linear-gradient(135deg, #2D1B8F 0%, #1E0F6B 100%);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 12px 35px rgba(45, 27, 143, 0.35);
      position: relative;
      overflow: hidden;
    }

    .id-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
    }

    .id-card-inner {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    .id-avatar {
      width: 55px;
      height: 55px;
      background: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .id-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding-top: 4px;
    }

    .id-line {
      height: 7px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 4px;
    }

    .id-line-1 {
      width: 100%;
    }

    .id-line-2 {
      width: 85%;
    }

    .id-line-3 {
      width: 70%;
    }

    .id-line-4 {
      width: 55%;
      margin-top: 2px;
    }

    /* Login Form Card */
    .login-form-card {
      position: relative;
      background: linear-gradient(135deg, #8B6FE8 0%, #6B4FD8 100%);
      border-radius: 28px;
      padding: 55px 50px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 70px rgba(107, 79, 216, 0.45);
      z-index: 100;
      animation: slideUp 0.7s ease-out;
    }

    .form-title {
      color: white;
      font-size: 30px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 40px;
      letter-spacing: 0.3px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .form-group {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 18px 22px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      background: white;
      color: #2D2D2D;
      outline: none;
      transition: all 0.3s ease;
      font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
      text-align: right;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .form-input::placeholder {
      color: #A0A0A0;
      font-weight: 400;
    }

    .form-input:focus {
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    .form-submit {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2D1B8F 0%, #1E0F6B 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
      box-shadow: 0 6px 20px rgba(45, 27, 143, 0.3);
    }

    .form-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(45, 27, 143, 0.45);
    }

    .form-submit:active {
      transform: translateY(-1px);
    }

    /* Decorative Leaf Shapes */
    .leaf-shape {
      position: absolute;
      pointer-events: none;
    }

    .leaf-1 {
      width: 90px;
      height: 90px;
      background: rgba(171, 143, 255, 0.18);
      border-radius: 0 50% 50% 50%;
      top: 14%;
      right: 24%;
      transform: rotate(-45deg);
      animation: float 6s ease-in-out infinite 0.5s;
    }

    .leaf-2 {
      width: 70px;
      height: 70px;
      background: rgba(139, 111, 232, 0.15);
      border-radius: 50% 0 50% 50%;
      bottom: 22%;
      right: 18%;
      transform: rotate(45deg);
      animation: float 7s ease-in-out infinite 1.5s;
    }

    /* Animations */
    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-25px) rotate(2deg);
      }
    }

    @keyframes flyPlane {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }
      25% {
        transform: translate(35px, -25px) rotate(8deg);
      }
      50% {
        transform: translate(70px, -15px) rotate(-5deg);
      }
      75% {
        transform: translate(35px, 15px) rotate(5deg);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
      20%, 40%, 60%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.5s ease-in-out;
    }

    .custom-alert {
      position: fixed;
      top: 30px;
      right: 30px;
      padding: 16px 24px;
      border-radius: 12px;
      font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      z-index: 10000;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s ease;
      max-width: 350px;
      text-align: right;
    }

    .custom-alert.show {
      opacity: 1;
      transform: translateY(0);
    }

    .custom-alert-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }

    .custom-alert-error {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .id-card-wrapper {
        opacity: 0.6;
        transform: scale(0.85);
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      .login-form-card {
        padding: 45px 35px;
        max-width: 380px;
      }

      .form-title {
        font-size: 26px;
        margin-bottom: 35px;
      }

      .id-card-wrapper {
        display: none;
      }

      .paper-plane-container {
        top: 8%;
        right: 8%;
        transform: scale(0.75);
      }

      .bg-circle-1 {
        width: 280px;
        height: 280px;
      }

      .leaf-1,
      .leaf-2 {
        opacity: 0.5;
      }

      .custom-alert {
        top: 20px;
        right: 20px;
        left: 20px;
        max-width: none;
      }
    }

    @media (max-width: 480px) {
      .login-form-card {
        padding: 35px 25px;
      }

      .form-title {
        font-size: 24px;
      }

      .form-input {
        padding: 16px 18px;
        font-size: 15px;
      }

      .form-submit {
        padding: 16px;
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Background Decorative Elements -->
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
    <div class="bg-circle bg-circle-4"></div>
    
    <!-- Decorative Dots -->
    <div class="dots dots-1"></div>
    <div class="dots dots-2"></div>
    
    <!-- Curved Line -->
    <svg class="curved-line" width="200" height="150" viewBox="0 0 200 150">
      <path d="M 20 80 Q 60 40, 100 60 T 180 50" stroke="#E0D4F7" stroke-width="2" fill="none"/>
    </svg>
    
    <!-- Paper Plane with Trail -->
    <div class="paper-plane-container">
      <svg class="plane-trail" width="250" height="120" viewBox="0 0 250 120">
        <path d="M 10 60 Q 80 30, 150 50 Q 200 60, 240 45" stroke="#9B7FFF" stroke-width="2.5" stroke-dasharray="8,8" fill="none" opacity="0.6"/>
      </svg>
      <svg class="paper-plane" width="45" height="45" viewBox="0 0 45 45">
        <path d="M 8 22 L 37 8 L 28 37 L 22 25 L 8 22 Z" fill="#6B4FD8" stroke="#6B4FD8" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M 22 25 L 28 37" stroke="#6B4FD8" stroke-width="1.5"/>
      </svg>
    </div>

    <!-- ID Card Illustration (Bottom Left) -->
    <div class="id-card-wrapper">
      <div class="id-card">
        <div class="id-card-inner">
          <div class="id-avatar">
            <svg width="45" height="45" viewBox="0 0 45 45">
              <circle cx="22.5" cy="16" r="9" fill="#8B6FE8"/>
              <path d="M 8 38 C 8 28 13 24 22.5 24 C 32 24 37 28 37 38" fill="#8B6FE8"/>
            </svg>
          </div>
          <div class="id-lines">
            <div class="id-line id-line-1"></div>
            <div class="id-line id-line-2"></div>
            <div class="id-line id-line-3"></div>
            <div class="id-line id-line-4"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Login Form Card (Center) -->
    <div class="login-form-card">
      <h1 class="form-title">ورود به سامانه</h1>
      
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="نام کاربری"
            required
          >
        </div>
        
        <div class="form-group">
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="رمز عبور"
            required
          >
        </div>
        
        <button type="submit" class="form-submit">ورود</button>
      </form>
    </div>

    <!-- Decorative Leaf Shapes -->
    <div class="leaf-shape leaf-1"></div>
    <div class="leaf-shape leaf-2"></div>
  </div>

  <script src="api.js"></script>
  <script>

      if (!document.getElementById('errorMsg')) {
      const form = document.getElementById('loginForm');
      if (form) {
        const errorDiv = document.createElement('div');
        errorDiv.id = 'errorMsg';
        errorDiv.style.cssText = 'display: none; padding: 10px; margin: 10px 0; border-radius: 5px;';
        form.insertBefore(errorDiv, form.querySelector('button'));
      }
    } 

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
  
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
  
      if (errorMsg) errorMsg.style.display = 'none';
  
      if (!username || !password) {
        showError('لطفا تمام فیلدها را پر کنید');
        return;
      }
  
      try {
        const result = await AuthAPI.login(username, password);
        const userRole = result.role || 'student';

        showSuccess('ورود موفق! در حال انتقال...');

        setTimeout(() => {
          const dashboards = {
            'admin': 'admin-dashboard.html',
            'professor': 'professor-dashboard.html',
            'student': 'student-dashboard.html'
          };
          const dashboardUrl = dashboards[userRole] || 'student-dashboard.html';
          console.log(`هدایت به داشبورد: ${userRole} -> ${dashboardUrl}`);
          window.location.href = dashboardUrl;
        }, 1000);

      } catch (err) {
        console.error(err);
        showError(err.message || 'خطا در ارتباط با سرور');
      }
    });

    function showError(message) {
      const errorMsg = document.getElementById('errorMsg');
      if (errorMsg) {
        errorMsg.textContent = message;
        errorMsg.style.backgroundColor = '#ef4444';
        errorMsg.style.color = 'white';
        errorMsg.style.display = 'block';
      }
      console.error('خطا:', message);
    }

    function showSuccess(message) {
      const errorMsg = document.getElementById('errorMsg');
      if (errorMsg) {
        errorMsg.textContent = message;
        errorMsg.style.backgroundColor = '#10b981';
        errorMsg.style.color = 'white';
        errorMsg.style.display = 'block';
      }
      console.log('موفق:', message);
    }
  </script>
</body>
</html>
