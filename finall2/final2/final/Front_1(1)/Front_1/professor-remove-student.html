<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست دانشجویان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #60a5fa;
            --primary-dark: #1d4ed8;
            --secondary: #8b5cf6;
            --danger: #ef4444;
            --danger-light: #f87171;
            --white: #ffffff;
            --light: #f8fafc;
            --gray-200: #e2e8f0;
            --gray-800: #1e293b;
            --border-radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Vazirmatn', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        .container {
            width: 100%;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(37, 99, 235, 0.15);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 30px;
            text-align: center;
            width: 100%;
        }

        .course-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .course-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .content {
            min-height: calc(100vh - 40px);
            padding: 40px;
            width: 100%;
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
        }

        .table-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .students-table {
            width: auto;
            min-width: 90%;
            border-collapse: collapse;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            overflow: hidden;
            margin: 0 auto;
        }

        .students-table thead {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .students-table th {
            padding: 18px 25px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            border: none;
            white-space: nowrap;
        }

        .students-table th:first-child {
            border-top-right-radius: 12px;
            padding: 18px 20px;
        }

        .students-table th:last-child {
            border-top-left-radius: 12px;
        }

        .students-table tbody tr {
            border-bottom: 2px solid var(--gray-200);
            transition: var(--transition);
        }

        .students-table tbody tr:hover {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.03), rgba(96, 165, 250, 0.03));
            transform: translateY(-2px);
        }

        .students-table td {
            padding: 18px 25px;
            text-align: center;
            vertical-align: middle;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
        }

        .student-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 15px;
            margin: 0 auto;
        }

        .delete-btn {
            background: linear-gradient(135deg, var(--danger), var(--danger-light));
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.2);
            margin: 0 auto;
        }

        .delete-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
            background: linear-gradient(135deg, #dc2626, var(--danger));
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--gray-200);
            display: block;
        }

        .back {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .back-button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 10px 25px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
        }

        @media (max-width: 1024px) {
            .students-table {
                width: 95%;
            }
            
            .students-table th,
            .students-table td {
                padding: 16px 20px;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 25px 20px;
            }
            
            .header h1 {
                font-size: 24px;
                flex-direction: column;
                gap: 10px;
            }
            
            .course-info {
                flex-direction: column;
                gap: 10px;
            }
            
            .content {
                padding: 25px 15px;
            }
            
            .table-container {
                overflow-x: auto;
                width: 100%;
                justify-content: flex-start;
            }
            
            .students-table {
                width: auto;
                min-width: 100%;
            }
            
            .students-table th,
            .students-table td {
                padding: 14px 15px;
                font-size: 14px;
            }
            
            .student-avatar {
                width: 34px;
                height: 34px;
                font-size: 14px;
            }
            
            .delete-btn {
                padding: 7px 14px;
                font-size: 13px;
                gap: 6px;
            }
            
            .back-button {
                padding: 9px 22px;
                font-size: 13px;
                gap: 6px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 22px;
            }
            
            .course-badge {
                padding: 6px 15px;
                font-size: 12px;
            }
            
            .students-table th {
                font-size: 13px;
                padding: 12px 10px;
            }
            
            .students-table td {
                padding: 12px 10px;
                font-size: 13px;
            }
            
            .student-avatar {
                width: 32px;
                height: 32px;
                font-size: 13px;
            }
            
            .delete-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            
            .back-button {
                padding: 8px 20px;
                font-size: 12px;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-user-graduate"></i>
                لیست دانشجویان
            </h1>
            <p id="course-name">در حال بارگذاری درس...</p>
    
            <div class="course-info">
                <div class="course-badge">
                    <i class="fas fa-calendar-alt"></i>
                    <span>نیمسال اول ۱۴۰۴</span>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="table-container">
                <table class="students-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>نام و نام خانوادگی</th>
                            <th>شماره دانشجویی</th>
                            <th>رشته تحصیلی</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="students-list">
                    </tbody>
                </table>
            </div>

            <div class="back">
                <button class="back-button" onclick="goToDashboard()">
                    <i class="fas fa-arrow-right"></i>
                    بازگشت به داشبورد
                </button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
    let COURSE_ID = null; 

    document.addEventListener('DOMContentLoaded', async () => {
        await loadCourse(); // دریافت آیدی و نام درس
    });

    async function loadCourse() {
        const courseNameEl = document.getElementById('course-name');
        const urlParams = new URLSearchParams(window.location.search);
        COURSE_ID = urlParams.get('courseId');
        courseNameEl.textContent = 'در حال بارگذاری درس...';

        try {
            if (!COURSE_ID) {
                throw new Error('آیدی درس مشخص نشده است');
            }

            // از لیست دروس استاد، درس مورد نظر را پیدا کن
            const data = await ProfessorAPI.getCourses();
            const course = (data.courses || []).find(c => String(c.id) === String(COURSE_ID));
            if (!course) {
                throw new Error('درس مورد نظر یافت نشد');
            }

            courseNameEl.textContent = `درس: ${course.name} (${COURSE_ID})`;

            await loadStudents();

        } catch (error) {
            console.error(error);
            courseNameEl.textContent = ' خطا در بارگذاری درس';
            showToast(error.message || 'ارتباط با سرور برقرار نشد', 'error');
        }
    }

    async function loadStudents() {
        if (!COURSE_ID) return;

        const tbody = document.getElementById('students-list');
        tbody.innerHTML = `
            <tr>
                <td colspan="5">در حال بارگذاری...</td>
            </tr>
        `;

        try {
            const students = await ProfessorAPI.getCourseStudents(COURSE_ID);
            if (!students || students.length === 0) {
                showEmptyState();
                return;
            }

            renderStudents(students);

        } catch (error) {
            console.error(error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="5">خطا در بارگذاری دانشجویان</td>
                </tr>
            `;
            showToast('ارتباط با سرور برقرار نشد', 'error');
        }
    }

    function renderStudents(students) {
        const tbody = document.getElementById('students-list');
        tbody.innerHTML = '';

        students.forEach(student => {
            const tr = document.createElement('tr');
            tr.dataset.studentId = student.id;

            tr.innerHTML = `
                <td>
                    <div class="student-avatar">${student.fullName.charAt(0)}</div>
                </td>
                <td>${student.fullName}</td>
                <td>${student.id}</td>
                <td>${student.major}</td>
                <td>
                    <button class="delete-btn" onclick="removeStudent('${student.id}')">
                        <i class="fas fa-user-minus"></i> حذف
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        });
    }

    async function removeStudent(studentId) {
        if (!confirm('آیا از حذف این دانشجو اطمینان دارید؟')) return;

        const btn = document.querySelector(`[data-student-id="${studentId}"] .delete-btn`);
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال حذف...';

        try {
            await ProfessorAPI.removeStudent(COURSE_ID, studentId);

            document.querySelector(`[data-student-id="${studentId}"]`).remove();

            if (document.querySelectorAll('#students-list tr').length === 0) {
                showEmptyState();
            }

            showToast('دانشجو با موفقیت حذف شد', 'success');

        } catch (error) {
            console.error(error);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-user-minus"></i> حذف';
            showToast('خطا در حذف دانشجو', 'error');
        }
    }

    function showEmptyState() {
        document.getElementById('students-list').innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty-state">
                        <i class="fas fa-user-slash"></i>
                        <p>دانشجویی یافت نشد</p>
                    </div>
                </td>
            </tr>
        `;
    }

    function showToast(message, type = 'info') {
        alert(message);
    }

    function goToDashboard() {
        window.location.href = 'professor-dashboard.html';
    }
</script>
</body>
</html>
