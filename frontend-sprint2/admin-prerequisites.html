<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت پیش‌نیازها - پنل ادمین</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- نوار ناوبری -->
  <nav class="bg-purple-800 text-white p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">پنل مدیریت پیش‌نیازها</h1>
      <div class="space-x-4">
        <a href="dashboard.html" class="hover:underline">داشبورد</a>
        <a href="courses.html" class="hover:underline">لیست دروس</a>
      </div>
    </div>
  </nav>

  <div class="container mx-auto mt-10 px-4 max-w-6xl">
    <!-- هشدار اگر ادمین نیست -->
    <div id="notAdminAlert" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6 hidden">
      <p>شما دسترسی ادمین ندارید. تنها مدیر سیستم می‌تواند پیش‌نیازها را مدیریت کند.</p>
    </div>

    <!-- بخش اصلی (مخفی تا زمانی که ادمین باشد) -->
    <div id="adminContent" class="hidden">
      <!-- بخش ۱: افزودن پیش‌نیاز جدید -->
      <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
        <h2 class="text-2xl font-bold text-purple-700 mb-6">افزودن پیش‌نیاز جدید</h2>
        <form id="addPrereqForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-gray-700 mb-2">درس اصلی:</label>
              <select id="courseSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" required>
                <option value="">انتخاب درس...</option>
                <!-- با JS پر می‌شود -->
              </select>
            </div>
            <div>
              <label class="block text-gray-700 mb-2">پیش‌نیاز:</label>
              <select id="prereqSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" required>
                <option value="">انتخاب پیش‌نیاز...</option>
                <!-- با JS پر می‌شود -->
              </select>
            </div>
          </div>
          <div class="flex justify-end">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-medium transition duration-200">
              ثبت پیش‌نیاز
            </button>
          </div>
        </form>
        <div id="addSuccess" class="mt-4 p-3 bg-green-100 text-green-700 rounded hidden"></div>
        <div id="addError" class="mt-4 p-3 bg-red-100 text-red-700 rounded hidden"></div>
      </div>

      <!-- بخش ۲: لیست پیش‌نیازهای موجود -->
      <div class="bg-white rounded-2xl shadow-xl p-8">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-purple-700">پیش‌نیازهای تعریف شده</h2>
          <button id="refreshBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg">
            بروزرسانی لیست
          </button>
        </div>
        
        <!-- فیلتر جستجو -->
        <div class="mb-6">
          <input type="text" id="searchPrereq" placeholder="جستجو بر اساس نام درس..." 
                 class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
        </div>

        <!-- جدول پیش‌نیازها -->
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-100">
              <tr>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">درس اصلی</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">پیش‌نیاز</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">عملیات</th>
              </tr>
            </thead>
            <tbody id="prereqTableBody" class="bg-white divide-y divide-gray-200">
              <!-- با JS پر می‌شود -->
              <tr>
                <td colspan="3" class="px-6 py-8 text-center text-gray-500">
                  <div class="animate-spin rounded-full h-8 w-8 border-4 border-purple-600 border-t-transparent mx-auto"></div>
                  <p class="mt-2">در حال بارگذاری...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- پیام خالی -->
        <div id="emptyMessage" class="text-center py-8 text-gray-500 hidden">
          <p>هنوز پیش‌نیازی تعریف نشده است.</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/admin-prerequisites.js"></script>
</body>
</html>
