<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات درس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-purple-700 text-white p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">جزئیات درس</h1>
      <a href="courses.html" class="hover:underline">بازگشت</a>
    </div>
  </nav>
  <div class="container mx-auto mt-8 px-4 max-w-4xl">
    <div id="loading" class="text-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-purple-600 border-t-transparent mx-auto"></div>
    </div>
    <div id="detailCard" class="bg-white rounded-2xl shadow-xl p-8 hidden">
      <h2 id="name" class="text-3xl font-bold text-purple-700 mb-6"></h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-lg">
        <p><strong>کد درس:</strong> <span id="code"></span></p>
        <p><strong>استاد:</strong> <span id="professor"></span></p>
        <p><strong>ظرفیت:</strong> <span id="capacity"></span></p>
        <p><strong>مکان:</strong> <span id="location"></span></p>
        <p><strong>زمان برگزاری:</strong> <span id="schedule"></span></p>
        <div class="md:col-span-2">
          <strong>پیشنیاز ها:</strong>
          <ul id="prereqs" class="list-disc list-inside mt-2 text-purple-600"></ul>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { apiFetch } from './js/api.js';
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    async function loadDetail() {
      try {
        const course = await apiFetch(`/courses/${id}/`);
        document.getElementById('name').textContent = course.name;
        document.getElementById('code').textContent = course.code;
        document.getElementById('professor').textContent = course.professor_name;
        document.getElementById('capacity').textContent = `${course.remaining_capacity}/${course.capacity}`;
        document.getElementById('location').textContent = course.location || 'نامشخص';
        document.getElementById('schedule').textContent = course.schedule || 'نامشخص';

        const prereqs = document.getElementById('prereqs');
        if (course.prerequisites.length === 0) {
          prereqs.innerHTML = '<li class="text-gray-500">ندارد</li>';
        } else {
          course.prerequisites.forEach(p => {
            const li = document.createElement('li');
            li.textContent = p.name;
            prereqs.appendChild(li);
          });
        }

        document.getElementById('detailCard').classList.remove('hidden');
      } catch (err) {
        alert('درسی یافت نشد');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    loadDetail();
  </script>
</body>
</html>
