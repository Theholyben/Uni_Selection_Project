<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لیست دروس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-purple-700 text-white p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">لیست دروس ارائه شده</h1>
      <a href="dashboard.html" class="hover:underline">داشبورد</a>
    </div>
  </nav>
  <div class="container mx-auto mt-8 px-4">
    <div class="bg-white p-6 rounded-xl shadow mb-8">
      <input type="text" id="searchInput" placeholder="نام استاد یا درس مورد نظر را وارد کنید " class="w-full px-4 py-3 border rounded-lg mb-4">
    </div>
    <div id="loading" class="text-center py-12 hidden">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-purple-600 border-t-transparent mx-auto"></div>
      <p class="mt-4">در حال بارگذاری دروس ...</p>
    </div>
    <div id="coursesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <p id="noResult" class="text-center text-gray-500 py-12 hidden">هیچ درسی یافت نشد</p>
  </div>
  <script type="module" src="js/courses.js"></script>
</body>
</html>
