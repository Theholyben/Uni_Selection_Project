<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>داشبورد</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <nav class="bg-purple-700 text-white p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">داشبورد کلی</h1>
      <button id="logoutBtn" class="bg-red-600 px-6 py-2 rounded">خروج</button>
    </div>
  </nav>

  <div class="container mx-auto mt-10 text-center">
    <h2 class="text-4xl font-bold text-purple-700 mb-10">به سیستم انتخاب واحد خوش آمدید</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-10 max-w-4xl mx-auto">

      <!-- ادمین -->
      <div id="adminSection" class="hidden col-span-2 flex flex-col gap-6">
        <button onclick="window.location.href='admin-prerequisites.html'"
                class="bg-purple-600 text-white px-6 py-3 rounded-lg shadow hover:bg-purple-700">
          مدیریت پیش‌نیازها
        </button>

        <button onclick="window.location.href='admin-unit-limits.html'"
                class="bg-purple-600 text-white px-6 py-3 rounded-lg shadow hover:bg-purple-700">
          تنظیم حداقل/حداکثر واحد
        </button>

        <button onclick="window.location.href='http://localhost:3000/admin-panel'"
                class="bg-purple-600 text-white px-6 py-3 rounded-lg shadow hover:bg-purple-700">
          ورود به پنل مدیریت دروس (React)
        </button>
      </div>

      <!-- استاد -->
      <div id="professorSection" class="hidden col-span-2">
        <button onclick="window.location.href='professor-students.html'"
                class="bg-purple-600 text-white px-6 py-3 rounded-lg shadow hover:bg-purple-700">
          لیست دانشجویان
        </button>
      </div>

      <!-- دانشجو -->
      <div id="studentSection" class="hidden col-span-2 flex flex-col gap-6">
        <button onclick="window.location.href='courses.html'"
                class="bg-purple-600 text-white px-6 py-3 rounded-lg shadow hover:bg-purple-700">
          لیست دروس
        </button>

        <button onclick="window.location.href='schedule.html'"
                class="bg-purple-600 text-white px-6 py-3 rounded-lg shadow hover:bg-purple-700">
          برنامه هفتگی
        </button>

        <button onclick="window.location.href='search.html'"
                class="bg-purple-600 text-white px-6 py-3 rounded-lg shadow hover:bg-purple-700">
          جستجوی دروس
        </button>
      </div>

    </div>
  </div>

  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
